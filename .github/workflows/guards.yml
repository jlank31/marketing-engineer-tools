name: guards

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  brand-leak:
    name: no credentials, identifiers, or client references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python tools/check_brand_leak.py

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  mirror-integrity:
    name: mirrored files unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify recorded hashes
        run: |
          if ! shasum -a 256 -c packages/robot-check/VENDORED.sha256; then
            echo "::error::A mirrored file was edited directly. These come from a private upstream; see CONTRIBUTING.md. The patch is still welcome. It gets replayed upstream and lands on the next sync."
            exit 1
          fi
