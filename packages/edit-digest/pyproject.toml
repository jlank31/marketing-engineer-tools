[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edit-digest"
version = "0.1.0"
description = "Learn an editor's style from before/after pairs. Turns redlines into rules your AI prompt can use. No model, no API calls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jared Castronova" }]
keywords = ["editing", "diff", "writing", "prompt-engineering", "style", "feedback"]
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/jlank31/marketing-engineer-tools"
Source = "https://github.com/jlank31/marketing-engineer-tools/tree/main/packages/edit-digest"

[project.scripts]
edit-digest = "edit_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edit_digest"]
