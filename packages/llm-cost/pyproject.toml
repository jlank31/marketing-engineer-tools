[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost"
version = "0.1.0"
description = "Real cost tracking and a budget circuit breaker for the Anthropic API. Counts the cache tokens and tool calls most trackers miss."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jared Castronova" }]
keywords = ["anthropic", "claude", "llm", "cost", "budget", "observability", "tokens"]

# The core is stdlib-only, so you can price and account for usage without
# installing an SDK. TrackedClient needs the SDK and says so on first use.
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]


[project.urls]
Homepage = "https://github.com/jlank31/marketing-engineer-tools"
Source = "https://github.com/jlank31/marketing-engineer-tools/tree/main/packages/llm-cost"

[project.scripts]
llm-cost = "llm_cost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost"]
